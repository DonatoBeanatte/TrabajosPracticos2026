<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TP9</h1>
    //Ejercicio 1 
    <h2>Numero mayor</h2>
    <input type="number" id="numero1" placeholder="numero1">
    <input type="number" id="numero2" placeholder="numero2">
    <button onclick="numeroMayor">Ver numero mayor</button>
    <p id="resultado1"></p>

    //Ejercicio 2
    <h2>Numero menor</h2>
    <input type="number" id="numero3" placeholder="numero1">
    <input type="number" id="numero4" placeholder="numero2">
    <button onclick="numeroMenor">Ver numero menor</button>
    <p id="resultado2"></p>

    //Ejercicio 3
    <h2>Numeros iguales o diferentes </h2>
    <input type="number" id="numero5" placeholder="numero1">
    <input type="number" id="numero6" placeholder="numero2">
    <button onclick="compararNumeros">Comparar</button>
    <p id="resultado3"></p>

    //Ejercicio 4
    <h2>Iva</h2>
    <input type="number" id="compra" placeholder="valor de compra">
    <button onclick="calcularIva">Calcula Iva</button>
    <p id="resultado4"></p>

    //Ejercicio 5
    <h2>Saludar</h2>
    <input type="text" id="nombre" placeholder="nombre">
    <button onclick="saludar">Saludar</button>
    <p id="resultado5"></p>

    //Ejercicio 6
    <h2>Modo oscuro</h2>
    <button onclick="modoOscuro">Modo oscuro</button>
    <p id="resultado6"></p>

    //Ejercicio 7
    <h2>Modo claro</h2>
    <button onclick="modoClaro">Modo claro</button>
    <p id="resultado7"></p>
</body>
<script src="app.js"></script>
</html>
